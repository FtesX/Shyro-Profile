<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Shyro.</title>

  <!-- SEO / Social preview (Discord, Twitter гэх мэт дээр линк хуваалцахад зураг+тайлбар харагдана) -->
  <meta name="description" content="Shyro — LANN Gaming Community-ийн админ. Steam, Discord, Faceit профайлууд нэг дор.">
  <meta name="theme-color" content="#00d9ff">
  <meta property="og:title" content="Shyro.">
  <meta property="og:description" content="LANN Gaming Community — Админ профайл">
  <meta property="og:image" content="https://avatars.fastly.steamstatic.com/2c48197aadb2c5f6ae085bda463098ccac9a99cb_full.jpg">
  <meta property="og:type" content="profile">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="https://avatars.fastly.steamstatic.com/2c48197aadb2c5f6ae085bda463098ccac9a99cb_full.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="loader">
    <img class="loader-avatar" src="https://avatars.fastly.steamstatic.com/2c48197aadb2c5f6ae085bda463098ccac9a99cb_full.jpg" alt="">
    <h2>Ачааллаж байна...</h2>
  </div>

  <div class="cursor"></div>
  <div class="cursor-trail"></div>
  <div class="background"></div>
  <div class="grid-overlay"></div>

  <main class="card">

    <!-- Avatar + online статус цэг -->
    <div class="avatar-wrap">
      <img class="avatar" src="https://avatars.fastly.steamstatic.com/2c48197aadb2c5f6ae085bda463098ccac9a99cb_full.jpg" alt="Shyro avatar">
      <span class="status-dot" id="statusDot" title="Статус" data-state="unknown"></span>
    </div>

    <h1>Shyro.</h1>
    <p class="status-text" id="statusText">Байдал шалгаж байна...</p>

    <div class="rank">👑 ADMIN</div>

    <!-- Badges -->
    <div class="badges">
      <span class="badge" title="Clan Admin">🛡️ Admin</span>
      <span class="badge" title="Founding member">⭐ Founder</span>
      <span class="badge" title="CS2 Player">🎯 CS2</span>
    </div>

    <p class="community">🎮 LANN Gaming Community</p>
    <p class="since">Discord-т элссэн: 2022-08-22</p>

    <!-- Social Buttons: Steam / Faceit / Discord -->
    <div class="buttons">
      <a class="social-tile" target="_blank" rel="noopener" href="https://steamcommunity.com/profiles/76561199482962460/">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/steam.svg" alt="">
        <span>Steam</span>
      </a>

      <a class="social-tile" target="_blank" rel="noopener" href="https://www.faceit.com/en/players/Fat1s_X">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/faceit.svg" alt="">
        <span>Faceit</span>
      </a>

      <a class="social-tile" target="_blank" rel="noopener" href="https://discord.com/users/1003847406372261951">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/discord.svg" alt="">
        <span>Discord</span>
      </a>
    </div>

    <!-- Discord ID хуулах -->
    <div class="id-row">
      <span>ID: 1003847406372261951</span>
      <button type="button" class="copy-btn" data-copy="1003847406372261951" aria-label="Discord ID хуулах">
        <i class="fa-regular fa-copy"></i>
      </button>
    </div>

    <!-- Хөгжим -->
    <div class="music-box">
      <p>🎵 Одоо тоглож буй</p>
      <h3>Starboy - The Weeknd</h3>

      <div class="visualizer" id="visualizer" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="timeCurrent">0:00</span>
        <span id="timeTotal">0:00</span>
      </div>

      <button type="button" id="music">▶ Тоглуулах</button>
    </div>

    <!-- Апп болгож суулгах (дэмждэг browser дээр л харагдана) -->
    <button type="button" class="install-btn" id="installBtn" aria-label="Апп суулгах" hidden>
      <i class="fa-solid fa-download"></i> Апп суулгах
    </button>

    <!-- Үзсэн тоо -->
    <p class="views">👀 Үзсэн: <span id="views">0</span></p>

  </main>

  <div class="toast" id="toast"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
