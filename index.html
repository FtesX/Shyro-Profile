<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Shyro.</title>

  <!-- SEO / Social preview -->
  <meta name="description" content="Shyro — LANN Gaming Community admin. Steam, Discord & Faceit profiles in one place.">
  <meta name="theme-color" content="#00d9ff">
  <meta property="og:title" content="Shyro.">
  <meta property="og:description" content="LANN Gaming Community — Admin profile">
  <meta property="og:image" content="https://avatars.fastly.steamstatic.com/2c48197aadb2c5f6ae085bda463098ccac9a99cb_full.jpg">
  <meta property="og:type" content="profile">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="https://avatars.fastly.steamstatic.com/2c48197aadb2c5f6ae085bda463098ccac9a99cb_full.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="loader">
    <img class="loader-avatar" src="https://avatars.fastly.steamstatic.com/2c48197aadb2c5f6ae085bda463098ccac9a99cb_full.jpg" alt="">
    <h2>Loading Shyro...</h2>
  </div>

  <div class="cursor"></div>
  <div class="cursor-trail"></div>

  <!-- Background layers: mesh gradient -> grid -> twinkling particles -->
  <div class="background"></div>
  <div class="grid-overlay"></div>
  <div class="particles"></div>

  <main class="card">

    <!-- Large hand-drawn "Shyro" signature sitting behind the card content
         as a subtle watermark (drawn once on load, then glows softly) -->
    <svg class="card-signature" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="sigGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00eaff"/>
          <stop offset="100%" stop-color="#9d00ff"/>
        </linearGradient>
      </defs>
      <text x="50%" y="58%" text-anchor="middle" class="signature-text">Shyro</text>
    </svg>

    <!-- Avatar + online status dot -->
    <div class="avatar-wrap">
      <img class="avatar" src="https://avatars.fastly.steamstatic.com/2c48197aadb2c5f6ae085bda463098ccac9a99cb_full.jpg" alt="Shyro avatar">
      <span class="status-dot" id="statusDot" title="Status" data-state="unknown"></span>
    </div>

    <h1>Shyro.</h1>
    <p class="status-text" id="statusText">Checking status...</p>

    <div class="rank">👑 ADMIN</div>

    <!-- Badges -->
    <div class="badges">
      <span class="badge" title="Clan Admin">🛡️ Admin</span>
      <span class="badge" title="Founding member">⭐ Founder</span>
      <span class="badge" title="CS2 Player">🎯 CS2</span>
    </div>

    <p class="community">🎮 LANN Gaming Community</p>
    <p class="since">Discord Since: 2022-08-22</p>

    <!-- Social Buttons: Steam / Faceit / Discord -->
    <div class="buttons">
      <a class="social-tile" target="_blank" rel="noopener" href="https://steamcommunity.com/profiles/76561199482962460/">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/steam.svg" alt="">
        <span>Steam</span>
      </a>

      <a class="social-tile" target="_blank" rel="noopener" href="https://www.faceit.com/en/players/Fat1s_X">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/faceit.svg" alt="">
        <span>Faceit</span>
      </a>

      <a class="social-tile" target="_blank" rel="noopener" href="https://discord.com/users/1003847406372261951">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/discord.svg" alt="">
        <span>Discord</span>
      </a>
    </div>

    <!-- Copy Discord ID -->
    <div class="id-row">
      <span>ID: 1003847406372261951</span>
      <button type="button" class="copy-btn" data-copy="1003847406372261951" aria-label="Copy Discord ID">
        <i class="fa-regular fa-copy"></i>
      </button>
    </div>

    <!-- Background music: plays automatically, no manual controls — just a live
         rhythm/equalizer visual instead of a track name box -->
    <div class="music-box" aria-hidden="true">
      <div class="visualizer" id="visualizer">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <!-- Install as app (only shows on supporting browsers) -->
    <button type="button" class="install-btn" id="installBtn" aria-label="Install app" hidden>
      <i class="fa-solid fa-download"></i> Install App
    </button>

    <!-- Views -->
    <p class="views">👀 Views: <span id="views">0</span></p>

  </main>

  <div class="toast" id="toast"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
